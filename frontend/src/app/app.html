<main class="shell">
  <header class="shell__header">
    <h1>{{ title() }}</h1>
    <p-button
      [label]="darkMode() ? 'Modo claro' : 'Modo oscuro'"
      icon="pi {{ darkMode() ? 'pi-sun' : 'pi-moon' }}"
      severity="secondary"
      (onClick)="toggleDarkMode()"
    />
  </header>

  <section class="shell__content">
    <p class="body-text">
      Sistema de gestión de Celulosa Baradero SA — placeholder de verificación de tema.
    </p>
    <div class="shell__actions">
      <p-button label="Acción primaria" />
      <p-button label="Acción secundaria" severity="secondary" />
      <p-button label="Peligro" severity="danger" />
    </div>
  </section>

  <router-outlet />
</main>
