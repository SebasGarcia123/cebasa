<div class="login">
  <p-card class="login__card">
    <ng-template #title>
      <div class="login__logo-card">
        <img src="/images/logo-celulosa-baradero.png" alt="Celulosa Baradero S.A." class="login__logo" />
      </div>
    </ng-template>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login__form">
      <div class="login__field">
        <label for="nombre_usuario">Usuario</label>
        <input
          id="nombre_usuario"
          type="text"
          pInputText
          formControlName="nombre_usuario"
          autocomplete="username"
        />
      </div>

      <div class="login__field">
        <label for="password">Contraseña</label>
        <div class="login__password-row">
          <input
            id="password"
            [type]="mostrarPassword() ? 'text' : 'password'"
            pInputText
            formControlName="password"
            autocomplete="current-password"
          />
          <p-button
            type="button"
            [text]="true"
            [icon]="mostrarPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'"
            [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            (onClick)="mostrarPassword.set(!mostrarPassword())"
          />
        </div>
      </div>

      @if (errorMessage(); as error) {
        <p-message severity="error" [text]="error" />
      }

      <p-button
        type="submit"
        label="Ingresar"
        styleClass="w-full"
        [loading]="loading()"
        [disabled]="form.invalid"
      />
    </form>
  </p-card>
</div>
