<div class="login">
  <p-card class="login__card">
    <ng-template #title>
      <img src="/images/logo-celulosa-baradero.png" alt="Celulosa Baradero S.A." class="login__logo" />
    </ng-template>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login__form">
      <div class="login__field">
        <label for="nombre_usuario">Usuario</label>
        <input
          id="nombre_usuario"
          type="text"
          pInputText
          formControlName="nombre_usuario"
          autocomplete="username"
        />
      </div>

      <div class="login__field">
        <label for="password">Contraseña</label>
        <p-password
          inputId="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="current-password"
        />
      </div>

      @if (errorMessage(); as error) {
        <p-message severity="error" [text]="error" />
      }

      <p-button
        type="submit"
        label="Ingresar"
        styleClass="w-full"
        [loading]="loading()"
        [disabled]="form.invalid"
      />
    </form>
  </p-card>
</div>
