<div class="page">
  <div class="page__header">
    <h1>Estados</h1>
    <p-button label="Nuevo" icon="pi pi-plus" (onClick)="openCreate()" />
  </div>

  <p-table [value]="estados()" [loading]="loading()" dataKey="id_estado" [paginator]="true" [rows]="10">
    <ng-template #header>
      <tr>
        <th scope="col" style="width: 5rem">ID</th>
        <th scope="col">Nombre</th>
        <th scope="col" style="width: 8rem"></th>
      </tr>
    </ng-template>
    <ng-template #body let-estado>
      <tr>
        <td>{{ estado.id_estado }}</td>
        <td>{{ estado.nombreEstado }}</td>
        <td class="page__actions">
          <p-button icon="pi pi-pencil" [text]="true" (onClick)="openEdit(estado)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" (onClick)="confirmDelete(estado)" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="3">No hay estados cargados todavía.</td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    [visible]="dialogVisible()"
    (visibleChange)="dialogVisible.set($event)"
    [modal]="true"
    [style]="{ width: '400px' }"
    [header]="editingId() ? 'Editar estado' : 'Nuevo estado'"
  >
    <form [formGroup]="form" (ngSubmit)="save()" class="page__form">
      <div class="page__field">
        <label for="nombreEstado">Nombre</label>
        <input id="nombreEstado" type="text" pInputText formControlName="nombreEstado" />
      </div>
      <div class="page__form-actions">
        <p-button
          type="button"
          label="Cancelar"
          severity="secondary"
          [outlined]="true"
          (onClick)="closeDialog()"
        />
        <p-button type="submit" label="Guardar" [loading]="saving()" [disabled]="form.invalid" />
      </div>
    </form>
  </p-dialog>
</div>
