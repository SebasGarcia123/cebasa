<div class="page">
  <div class="page__header">
    <h1>Productos</h1>
    <p-button label="Nuevo" icon="pi pi-plus" (onClick)="openCreate()" />
  </div>

  <p-table [value]="productos()" [loading]="loading()" dataKey="id_producto" [paginator]="true" [rows]="10">
    <ng-template #header>
      <tr>
        <th scope="col">Código</th>
        <th scope="col">Descripción</th>
        <th scope="col">Precio</th>
        <th scope="col">Stock</th>
        <th scope="col" style="width: 8rem"></th>
      </tr>
    </ng-template>
    <ng-template #body let-producto>
      <tr>
        <td>{{ producto.codigo_producto }}</td>
        <td>{{ producto.descripcion_producto }}</td>
        <td>{{ producto.precio_venta | number: '1.2-2' }}</td>
        <td>{{ producto.stock_actual }}</td>
        <td class="page__actions">
          <p-button icon="pi pi-pencil" [text]="true" (onClick)="openEdit(producto)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" (onClick)="confirmDelete(producto)" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="5">No hay productos cargados todavía.</td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    [visible]="dialogVisible()"
    (visibleChange)="dialogVisible.set($event)"
    [modal]="true"
    [style]="{ width: '420px' }"
    [header]="editingId() ? 'Editar producto' : 'Nuevo producto'"
  >
    <form [formGroup]="form" (ngSubmit)="save()" class="page__form">
      <div class="page__field">
        <label for="codigo_producto">Código</label>
        <input id="codigo_producto" type="text" pInputText formControlName="codigo_producto" />
      </div>

      <div class="page__field">
        <label for="descripcion_producto">Descripción</label>
        <input id="descripcion_producto" type="text" pInputText formControlName="descripcion_producto" />
      </div>

      <div class="page__field">
        <label for="bolsones_por_pallet">Bolsones por pallet</label>
        <p-inputNumber inputId="bolsones_por_pallet" formControlName="bolsones_por_pallet" [min]="0" />
      </div>

      <div class="page__field">
        <label for="peso_por_bolson">Peso por bolsón (kg)</label>
        <p-inputNumber
          inputId="peso_por_bolson"
          formControlName="peso_por_bolson"
          [minFractionDigits]="2"
          [maxFractionDigits]="2"
        />
      </div>

      <div class="page__field">
        <label for="precio_venta">Precio de venta</label>
        <p-inputNumber
          inputId="precio_venta"
          formControlName="precio_venta"
          mode="currency"
          currency="ARS"
          locale="es-AR"
        />
      </div>

      <div class="page__field">
        <label for="stock_actual">Stock actual</label>
        <p-inputNumber inputId="stock_actual" formControlName="stock_actual" [min]="0" />
      </div>

      <div class="page__field">
        <label for="stock_minimo">Stock mínimo</label>
        <p-inputNumber inputId="stock_minimo" formControlName="stock_minimo" [min]="0" />
      </div>

      <div class="page__form-actions">
        <p-button
          type="button"
          label="Cancelar"
          severity="secondary"
          [outlined]="true"
          (onClick)="closeDialog()"
        />
        <p-button type="submit" label="Guardar" [loading]="saving()" [disabled]="form.invalid" />
      </div>
    </form>
  </p-dialog>
</div>
