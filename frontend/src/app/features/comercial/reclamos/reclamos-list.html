<div class="page">
  <div class="page__header">
    <h1>Reclamos</h1>
    <p-button label="Nuevo" icon="pi pi-plus" (onClick)="openCreate()" />
  </div>

  <p-table [value]="reclamos()" [loading]="loading()" dataKey="id_reclamo" [paginator]="true" [rows]="10">
    <ng-template #header>
      <tr>
        <th scope="col">Fecha</th>
        <th scope="col">Cliente</th>
        <th scope="col">Descripción</th>
        <th scope="col">Estado</th>
        <th scope="col" style="width: 8rem"></th>
      </tr>
    </ng-template>
    <ng-template #body let-reclamo>
      <tr>
        <td>{{ reclamo.fecha | date: 'dd/MM/yyyy' }}</td>
        <td>{{ reclamo.clientes?.nombre_cli || '—' }}</td>
        <td>{{ reclamo.descripcion || '—' }}</td>
        <td>{{ reclamo.estados?.nombreEstado || '—' }}</td>
        <td class="page__actions">
          <p-button icon="pi pi-pencil" [text]="true" (onClick)="openEdit(reclamo)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" (onClick)="confirmDelete(reclamo)" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="5">No hay reclamos cargados todavía.</td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    [visible]="dialogVisible()"
    (visibleChange)="dialogVisible.set($event)"
    [modal]="true"
    [style]="{ width: '400px' }"
    [header]="editingId() ? 'Editar reclamo' : 'Nuevo reclamo'"
  >
    <form [formGroup]="form" (ngSubmit)="save()" class="page__form">
      <div class="page__field">
        <label for="fecha">Fecha</label>
        <p-datepicker inputId="fecha" formControlName="fecha" dateFormat="dd/mm/yy" [showIcon]="true" />
      </div>

      <div class="page__field">
        <label for="id_cliente">Cliente</label>
        <p-select
          inputId="id_cliente"
          formControlName="id_cliente"
          [options]="clientes()"
          optionLabel="nombre_cli"
          optionValue="id_cliente"
          [filter]="true"
          filterBy="nombre_cli"
          placeholder="Seleccionar cliente"
        />
      </div>

      <div class="page__field">
        <label for="descripcion">Descripción</label>
        <input id="descripcion" type="text" pInputText formControlName="descripcion" />
      </div>

      <div class="page__field">
        <label for="id_estado">Estado</label>
        <p-select
          inputId="id_estado"
          formControlName="id_estado"
          [options]="estados()"
          optionLabel="nombreEstado"
          optionValue="id_estado"
          placeholder="Seleccionar estado"
        />
      </div>

      <div class="page__form-actions">
        <p-button
          type="button"
          label="Cancelar"
          severity="secondary"
          [outlined]="true"
          (onClick)="closeDialog()"
        />
        <p-button type="submit" label="Guardar" [loading]="saving()" [disabled]="form.invalid" />
      </div>
    </form>
  </p-dialog>
</div>
