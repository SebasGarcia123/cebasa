<div class="page">
  <div class="page__header">
    <h1>Fleteros</h1>
    <p-button label="Nuevo" icon="pi pi-plus" (onClick)="openCreate()" />
  </div>

  <p-table
    [value]="fleteros()"
    [loading]="loading()"
    dataKey="id_fletero"
    [paginator]="true"
    [rows]="10"
  >
    <ng-template #header>
      <tr>
        <th scope="col">Nombre</th>
        <th scope="col">CUIT</th>
        <th scope="col">Teléfono</th>
        <th scope="col">Estado</th>
        <th scope="col" style="width: 8rem"></th>
      </tr>
    </ng-template>
    <ng-template #body let-fletero>
      <tr>
        <td>{{ fletero.nombre_fletero }}</td>
        <td>{{ fletero.cuit || '—' }}</td>
        <td>{{ fletero.telefono || '—' }}</td>
        <td>{{ fletero.estados?.nombreEstado || '—' }}</td>
        <td>
          <div class="page__actions">
            <p-button icon="pi pi-pencil" [text]="true" (onClick)="openEdit(fletero)" />
            <p-button
              icon="pi pi-trash"
              [text]="true"
              severity="danger"
              (onClick)="confirmDelete(fletero)"
            />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="4">No hay fleteros cargados todavía.</td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    [visible]="dialogVisible()"
    (visibleChange)="dialogVisible.set($event)"
    [modal]="true"
    [style]="{ width: '400px' }"
    [header]="editingId() ? 'Editar fletero' : 'Nuevo fletero'"
  >
    <form [formGroup]="form" (ngSubmit)="save()" class="page__form">
      <div class="page__field">
        <label for="nombre_fletero">Nombre</label>
        <input id="nombre_fletero" type="text" pInputText formControlName="nombre_fletero" />
      </div>

      <div class="page__field">
        <label for="cuit">CUIT</label>
        <input id="cuit" type="text" pInputText formControlName="cuit" />
      </div>

      <div class="page__field">
        <label for="telefono">Teléfono</label>
        <input id="telefono" type="text" pInputText formControlName="telefono" />
      </div>

      @if (editingId()) {
        <div class="page__field">
          <label for="id_estado">Estado</label>
          <p-select
            inputId="id_estado"
            formControlName="id_estado"
            [options]="estadosFletero()"
            optionLabel="nombreEstado"
            optionValue="id_estado"
            placeholder="Seleccionar estado"
            [appendTo]="'body'"
          />
        </div>
      }

      <div class="page__form-actions">
        <p-button
          type="button"
          label="Cancelar"
          severity="secondary"
          [outlined]="true"
          (onClick)="closeDialog()"
        />
        <p-button type="submit" label="Guardar" [loading]="saving()" [disabled]="form.invalid" />
      </div>
    </form>
  </p-dialog>
</div>
