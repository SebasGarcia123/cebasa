<div class="page">
  <div class="page__header">
    <h1>Depósitos</h1>
    <p-button label="Nuevo" icon="pi pi-plus" (onClick)="openCreate()" />
  </div>

  <p-table [value]="depositos()" [loading]="loading()" dataKey="id_deposito" [paginator]="true" [rows]="10">
    <ng-template #header>
      <tr>
        <th scope="col">Nombre</th>
        <th scope="col">Estado</th>
        <th scope="col" style="width: 8rem"></th>
      </tr>
    </ng-template>
    <ng-template #body let-deposito>
      <tr>
        <td>{{ deposito.nombre_deposito }}</td>
        <td>{{ deposito.estados?.nombreEstado || '—' }}</td>
        <td class="page__actions">
          <p-button icon="pi pi-pencil" [text]="true" (onClick)="openEdit(deposito)" />
          <p-button icon="pi pi-trash" [text]="true" severity="danger" (onClick)="confirmDelete(deposito)" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="3">No hay depósitos cargados todavía.</td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    [visible]="dialogVisible()"
    (visibleChange)="dialogVisible.set($event)"
    [modal]="true"
    [style]="{ width: '400px' }"
    [header]="editingId() ? 'Editar depósito' : 'Nuevo depósito'"
  >
    <form [formGroup]="form" (ngSubmit)="save()" class="page__form">
      <div class="page__field">
        <label for="nombre_deposito">Nombre</label>
        <input id="nombre_deposito" type="text" pInputText formControlName="nombre_deposito" />
      </div>

      @if (editingId()) {
        <div class="page__field">
          <label for="id_estado">Estado</label>
          <p-select
            inputId="id_estado"
            formControlName="id_estado"
            [options]="estadosDeposito()"
            optionLabel="nombreEstado"
            optionValue="id_estado"
            placeholder="Seleccionar estado"
            [appendTo]="'body'"
          />
        </div>
      }

      <div class="page__form-actions">
        <p-button
          type="button"
          label="Cancelar"
          severity="secondary"
          [outlined]="true"
          (onClick)="closeDialog()"
        />
        <p-button type="submit" label="Guardar" [loading]="saving()" [disabled]="form.invalid" />
      </div>
    </form>
  </p-dialog>
</div>
