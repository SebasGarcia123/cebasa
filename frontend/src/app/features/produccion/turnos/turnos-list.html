<div class="page">
  <div class="page__header">
    <h1>Turnos</h1>
    <p-button label="Nuevo" icon="pi pi-plus" (onClick)="openCreate()" />
  </div>

  <p-table
    [value]="turnos()"
    [loading]="loading()"
    dataKey="id_turno"
    [paginator]="true"
    [rows]="10"
  >
    <ng-template #header>
      <tr>
        <th scope="col">Descripción</th>
        <th scope="col">Estado</th>
        <th scope="col" style="width: 8rem"></th>
      </tr>
    </ng-template>
    <ng-template #body let-turno>
      <tr>
        <td>{{ turno.descripcion_turnos }}</td>
        <td>{{ turno.estados?.nombreEstado || '—' }}</td>
        <td>
          <div class="page__actions">
            <p-button icon="pi pi-pencil" [text]="true" (onClick)="openEdit(turno)" />
            <p-button
              icon="pi pi-trash"
              [text]="true"
              severity="danger"
              (onClick)="confirmDelete(turno)"
            />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="3">No hay turnos cargados todavía.</td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    [visible]="dialogVisible()"
    (visibleChange)="dialogVisible.set($event)"
    [modal]="true"
    [style]="{ width: '400px' }"
    [header]="editingId() ? 'Editar turno' : 'Nuevo turno'"
  >
    <form [formGroup]="form" (ngSubmit)="save()" class="page__form">
      <div class="page__field">
        <label for="descripcion_turnos">Descripción</label>
        <input
          id="descripcion_turnos"
          type="text"
          pInputText
          formControlName="descripcion_turnos"
        />
      </div>

      @if (editingId()) {
        <div class="page__field">
          <label for="id_estado">Estado</label>
          <p-select
            inputId="id_estado"
            formControlName="id_estado"
            [options]="estadosTurno()"
            optionLabel="nombreEstado"
            optionValue="id_estado"
            placeholder="Seleccionar estado"
            [appendTo]="'body'"
          />
        </div>
      }

      <div class="page__form-actions">
        <p-button
          type="button"
          label="Cancelar"
          severity="secondary"
          [outlined]="true"
          (onClick)="closeDialog()"
        />
        <p-button type="submit" label="Guardar" [loading]="saving()" [disabled]="form.invalid" />
      </div>
    </form>
  </p-dialog>
</div>
